<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SenseGuard | Industrial Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="application_wrapper" class="app-wrapper">
      <aside id="sidebar_container" class="sidebar-container">
        <header class="brand-header">
          <div class="brand-icon">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fff"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
          </div>
          <div class="brand-text-container">
            <span class="brand-name">SenseGuard</span>
            <span class="brand-version">Industrial v2.1</span>
          </div>
        </header>

        <nav id="navigation_menu" class="navigation-menu"></nav>

        <div class="sidebar-footer">
          <button class="nav-button w-full">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"
              />
            </svg>
            Configurações
          </button>
        </div>

        <div class="user-profile-badge">
          <div
            class="user-avatar"
            style="background: var(--violet-dim); color: var(--violet)"
          >
            CM
          </div>
          <div class="user-details">
            <span class="user-name">Carlos Mendes</span>
            <span class="user-role">Administrador</span>
          </div>
          <button class="logout-btn" onclick="app.logout()" title="Sair do sistema">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </aside>

      <div id="main_content_area" class="main-content-area">
        <header id="topbar_header" class="topbar-header"></header>
        <main id="view_container" class="view-container"></main>
      </div>
    </div>

    <div id="modal_overlay" class="modal-overlay">
      <section id="modal_panel" class="modal-panel">
        <header id="modal_header" class="modal-header">
          <h3 id="modal_title" class="modal-title"></h3>
          <button class="modal-close-button" onclick="app.closeModal()">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </header>
        <div id="modal_body" class="modal-body"></div>
        <footer id="modal_footer" class="modal-footer"></footer>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
